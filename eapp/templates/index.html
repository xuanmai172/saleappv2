{% extends 'layout/base.html' %}

{% block title %}Trang Chu{% endblock %}

{% block content %}
{% if products %}
<div class="row">
    {% for p in products %}
    <div class="col-md-3 col-6 p-2">
        <div class="card">
            <img class="card-img-top" src="{{ p.image }}" alt="Card image">
            <div class="card-body">
                <h4 class="card-title">{{p.name}}</h4>
                <p class="card-text">{{p.price}}</p>
                <a href="#" class="btn btn-primary">Xem chi tiet</a>
                <button class="btn btn-danger">Dat hang</button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<header>Khong co cai gi o day het</header>
{% endif %}

{% endblock %}
